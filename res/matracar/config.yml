# ---------------------------------------------------------------- MATRAMOTORS
# Mundos donde SÍ se pueden sacar y conducir coches y embarcaciones (vacío = todos menos los prohibidos)
mundos-permitidos:
  - world
# Mundos donde NO se pueden sacar ni conducir
mundos-prohibidos:
  - spawn

# Promocion: guardar tickets impresos de repostajes de al menos 'importe-minimo' $;
# con 'tickets-necesarios' encima, el siguiente repostaje es gratis hasta llenar.
promocion:
  tickets-necesarios: 10
  importe-minimo: 5

zona-horaria: Europe/Madrid

# Matriculas: se dan por orden (0001 BBB, 0002 BBB...). Cambiarla por una a elegir cuesta:
matricula:
  precio-cambio: 2500

# Litros que trae un coche recien comprado
litros-al-comprar: 5

gasolina:
  # Datos oficiales del Ministerio (precio de la gasolina 95 E5), se consultan cada 6 horas.
  # Se hace la media de las gasolineras que esten a menos de radio-km de este punto.
  lugar: Madrid          # solo es un nombre para mostrar; cámbialo por tu zona
  latitud: 40.4168      # EJEMPLO (Madrid): pon las coordenadas de tu zona
  longitud: -3.7038
  radio-km: 12
  radio-nombres-km: 20     # de donde se sacan los nombres reales para las gasolineras nuevas
  provincia: '28'          # codigo INE de provincia (28 = Madrid)
  euros-a-dolares: 2.0     # 1 EUR real = 2 $ del server
  precio-por-defecto-euros: 1.55   # si no hay conexion
  litros-por-segundo: 2.0  # velocidad del surtidor
  # Gasolineras náuticas: la gasolina de puerto es algo más cara (euros reales por litro, antes de convertir)
  suplemento-nautico-euros: 0.0
  # Alrededor de cada gasolinera náutica no se puede poner ni se forma hielo (bloques de radio)
  radio-sin-hielo: 5

# Daños de los vehículos (proporcionales). Cada vehículo los multiplica por su resistencia y su vida.
danos:
  choque-desde: 0.35        # fracción de la velocidad máxima a partir de la que un choque de frente hace daño
  choque-maximo: 40         # % de daño de un choque de frente a tope (también es el tope por golpe)
  espera-entre-golpes: 20   # ticks sin daño tras un golpe (rozar una pared = un solo golpe)
  caida-desde: 3            # bloques de caída que no hacen daño
  caida-por-bloque: 6       # % por cada bloque de más (20 bloques = siniestro); al agua no hace daño

# Firme: la velocidad máxima de los coches según el suelo (1 = a tope). Asfalto = hormigón, caminos,
# piedra pulida, ladrillos, losas y escaleras; tierra = tierra, hierba, cultivos; arena = arena, grava, nieve, barro.
suelo:
  activado: true
  asfalto: 1.0
  tierra: 0.6
  arena: 0.4
  otro: 0.85
  todoterreno-sufre: 0.35   # el todoterreno solo nota el 35 % de la pérdida

# Clima real (el del mundo, que sincroniza ClimaReal)
clima:
  activado: true
  agarre-lluvia: 0.5        # con lluvia los coches frenan a la mitad y giran un 15 % peor
  barcos-tormenta: 0.8      # con tormenta las embarcaciones van al 80 % (y La Goma vuelca antes)

# Si a dos segundos por delante hay chunks sin generar, la velocidad se limita a esto (bloques/s)
chunks:
  velocidad-sin-generar: 10

# Taxímetro (coche Taxi y Taxi Boat). Tarifas de ejemplo (taxi de una gran ciudad española, 2026), en euros; ajústalas.
# 1 km = 'bloques-por-km' bloques (la misma escala que la gasolina) y se convierte a Ⓜ con gasolina.euros-a-dolares.
taximetro:
  bloques-por-km: 10
  tarifa1: {bajada: 1.70, km: 1.16, minima: 4.62}   # laborables de 7:00 a 21:00
  tarifa2: {bajada: 2.02, km: 1.43, minima: 5.66}   # noches, sábados, domingos y festivos
  suplemento-nautico: 0.25   # Taxi Boat: +25 %
  libre-minimo: 0.5          # el taxista puede poner su tarifa entre el 50 %
  libre-maximo: 2.0          # y el 200 % de la oficial
  margen: 0.20               # se retiene el precio + este margen por si el viaje se alarga
  segundos-para-aceptar: 30
  segundos-para-volver: 180  # bajarse y subirse al mismo taxi antes de esto sigue la misma carrera
  segundos-sin-taxista: 120
  radio-llegada: 30
  porcentaje-llegada: 0.9

# velocidad en bloques/segundo; aceleracion y frenada en bloques/tick por tick;
# giro en grados por tick; deposito en litros; consumo en litros por bloque
