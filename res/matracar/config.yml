# Copias de llave (/coche copiallave con la llave en la mano)
llaves:
  precio-copia: 500

# Carrocerias (hechas con bloques de Minecraft, sin pack de texturas)
modelos:
  giro-extra: 0               # si los coches se vieran de lado o al reves, pon 90, 180 o 270
  matricula-al-reves: false   # si las matriculas no se ven, ponlo a true

# Base invisible de los vehiculos (desde la 2.2.0 es un soporte de armadura invisible, no una vagoneta)
base:
  escala: 0.19     # tamano de la base: 0.19 deja al conductor a la misma altura que en la vagoneta de antes
  gravedad: 0.04   # gravedad de la base (la de las vagonetas)

# ---------------------------------------------------------------- Seguros
# Cuota SEMANAL = precio del coche x este porcentaje (x bonus-malus).
# Mensual = 4 semanas con descuento. Sin seguro en vigor no se puede conducir.
seguros:
  terceros: 0.015      # Mutua Central: paga los atropellos
  ampliado: 0.03       # La Previsora: + 1 grua/semana, 5 L emergencia, 50 % reparaciones
  todoriesgo: 0.05     # Aseguradora Norte: + grua gratis, 10 L, reparaciones gratis, coche nuevo en siniestro
  descuento-mensual: 0.15
  precio-grua: 300
  franquicia-siniestro: 0.2
  indemnizacion:
    por-vida-jugador: 40   # $ por cada punto de vida quitado a un jugador
    muerte-jugador: 800    # extra si muere
    espera-minutos: 10     # como mucho un parte indemnizado por pareja conductor-perjudicado en este tiempo
    tope-diario: 2000      # lo máximo que cobra un perjudicado al día
  # Las primas van a un fondo común (seguros.yml -> fondo) y las indemnizaciones salen de él;
  # si el fondo no llega, pone el resto el titular de la póliza. Así el seguro no crea dinero.
  # valores de animales (si no se pone, se usan los de fabrica: vaca 150, caballo 800, aldeano 1500...)
  valores: {}

atropellos:
  desde-velocidad: 4       # bloques/s a partir de los que hace daño
  dano-por-velocidad: 0.8  # vida quitada = (velocidad - 3) x esto  (a 12 bl/s: 7,2 = 3,6 corazones)

averias:
  desgaste-por-bloque: 0.0025  # 1 % cada 400 bloques
  choque-desde: 5              # bloques/s a partir de los que un choque daña el coche
  choque-factor: 3             # % de daño = (velocidad - 4) x esto
  coste-reparacion: 0.15       # reparar del 0 al 100 % cuesta el 15 % del precio del coche

# Desguace (/coche desguace): paga hasta esta parte del precio nuevo, segun el estado del coche
desguace:
  maximo: 0.5

# Claxon (espacio al conducir). Cada vehiculo pita distinto.
claxon:
  alcance: 1.5   # hasta donde se oye: 1 = 16 bloques, 1.5 = 24, 2 = 32
  fuerza: 3      # lo fuerte que suena de cerca (sonidos superpuestos, 1 a 6)

