name: MatraMotors
version: 0.1.0-beta
main: matracraft.coches.Coches
api-version: '1.21'
description: MatraMotors - coches, barcos y trenes con combustible a precio real, seguros, matriculas, taximetro y llaves
provides: [MATRAMOTORS, Matracar]
author: Matracraft
softdepend: [Vault, VaultUnlocked, Essentials, GriefPrevention, Magic, Multiverse-Core]
commands:
  coche:
    description: Comprar y gestionar coches
    usage: /coche [comprar [tier] | tickets | ticket | matricula <NNNN LLL>]
    aliases: [coches]
  vehiculos:
    description: Menu unico de vehiculos (coches, barcos y trenes)
    aliases: [vehiculo, garaje, matramotors]
  gasolina:
    description: Precio de hoy de la gasolina
  barco:
    description: Embarcaciones (mismo menu que /coche)
    aliases: [barcos, lancha]
  taximetro:
    description: Encender o apagar el taximetro del taxi en el que vas
    aliases: [taxi]
  gasolinera:
    description: Crear o borrar surtidores (admin)
    permission: coches.admin
    usage: /gasolinera crear [nombre] | renombrar <nombre> | borrar [nombre] | lista | ir <nombre>
  tren:
    description: Menu de trenes (concesionario, mis trenes, estaciones y lineas)
    aliases: [trenes, matratren]
  matrains:
    description: Pruebas de trenes (administrador)
    permission: matrains.admin
permissions:
  coches.admin:
    description: Dar coches, crear surtidores
    default: op
  matrains.admin:
    default: op
